<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uber Office Commute</title>
<style>
:root{
  --ink:#15182B; --ink-soft:#5B5F79; --bg:#F7F6F3; --card:#FFFFFF;
  --line:#E7E4DC; --accent:#D4772C; --accent-soft:#FBEADB; --teal:#1F4E4A;
  --danger:#B3432E; --ok:#2E6B4F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);height:100%;}
html,body{height:100%;}
#app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;padding-bottom:76px;}
@media(min-width:900px){
  #app{max-width:520px;box-shadow:0 0 40px rgba(0,0,0,.06);min-height:100vh;}
}
.topbar{display:flex;align-items:center;gap:12px;padding:18px 20px 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;}
.back{border:none;background:var(--card);width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer;border:1px solid var(--line);}
.topbar h2{font-size:15px;margin:0;color:var(--ink-soft);font-weight:600;}
.screen{padding:8px 20px 20px;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
h1{font-size:28px;line-height:1.15;margin:14px 0 6px;letter-spacing:-.01em;}
.sub{color:var(--ink-soft);font-size:15px;line-height:1.5;margin:0 0 22px;}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:600;cursor:pointer;text-align:center;}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary:active{opacity:.85;}
.btn-secondary{background:var(--card);color:var(--ink);border:1px solid var(--line);margin-top:10px;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
.field input,.field select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);font-size:15px;background:#fff;color:var(--ink);}
.field input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.err{color:var(--danger);font-size:13px;margin-top:6px;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink-soft);}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.plans{display:flex;flex-direction:column;gap:10px;}
.plan-card{border:2px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;background:#fff;}
.plan-card.sel{border-color:var(--accent);background:var(--accent-soft);}
.plan-card h3{margin:0 0 2px;font-size:17px;}
.plan-card p{margin:0 0 8px;color:var(--ink-soft);font-size:13px;}
.plan-card ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink);line-height:1.7;}
.row{display:flex;justify-content:space-between;align-items:center;}
.time-list{display:flex;flex-direction:column;gap:8px;}
.time-opt{padding:14px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;}
.time-opt.sel{border-color:var(--accent);background:var(--accent-soft);}
.toggle{width:46px;height:27px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;flex:none;}
.toggle.on{background:var(--ink);}
.toggle .dot{width:21px;height:21px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:.2s;}
.toggle.on .dot{left:22px;}
.review-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
.review-line:last-child{border:none;}
.review-line b{font-weight:600;}
.badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;}
.b-Scheduled{background:#E7EFEA;color:var(--ok);}
.b-Changed{background:var(--accent-soft);color:var(--accent);}
.b-Skipped{background:#F2E7E3;color:var(--danger);}
.b-Completed{background:#EEEEEE;color:var(--ink-soft);}
.ride-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.ride-row:last-child{border-bottom:none;}
.ride-time{font-weight:700;font-size:15px;}
.ride-dir{font-size:13px;color:var(--ink-soft);}
.day-block{margin-bottom:16px;}
.day-title{font-size:13px;font-weight:700;color:var(--ink-soft);margin:0 0 6px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;}
.stat b{display:block;font-size:22px;}
.stat span{font-size:12px;color:var(--ink-soft);}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:20;}
@media(min-width:900px){.nav{max-width:520px;}}
.nav button{flex:1;background:none;border:none;font-size:11px;color:var(--ink-soft);padding:6px 0;cursor:pointer;font-weight:600;}
.nav button.active{color:var(--ink);}
.nav .ic{font-size:19px;display:block;margin-bottom:2px;}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:50;max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2);}
.concept{display:inline-block;margin-top:2px;font-size:10px;font-weight:700;color:var(--teal);background:#E3ECEA;padding:3px 8px;border-radius:6px;}
.check-icn{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin:8px auto 16px;}
.progress{display:flex;gap:5px;margin-bottom:6px;}
.progress span{height:4px;flex:1;background:var(--line);border-radius:2px;}
.progress span.done{background:var(--ink);}
</style>
</head>
<body>
<div id="app"></div>
<script>
function log(e,d){console.log('[analytics]',e,d||'');}
let S = JSON.parse(localStorage.getItem('occ_state')||'null') || {
  screen:'home', plan:'basic',
  commute:{homeLocation:'',officeLocation:'',officeDays:['Mon','Tue','Thu','Fri'],morningTime:'08:30',returnTime:'18:30',twoWay:true},
  active:false, rides:[], pendingChangeTime:null, selectedRideId:null,
  stats:{skipped:0,changed:0}
};
function save(){localStorage.setItem('occ_state',JSON.stringify(S));}
function go(screen){S.screen=screen;save();render();window.scrollTo(0,0);}
function fmt12(t){let [h,m]=t.split(':').map(Number);let ap=h>=12?'PM':'AM';let hh=h%12||12;return hh+':'+String(m).padStart(2,'0')+' '+ap;}
function genRides(){
  const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const labels=['Today','Tomorrow','Thursday','Friday'];
  let rides=[];let count=0;let d=new Date();
  for(let i=0;i<10 && count<4;i++){
    let dn=dayNames[d.getDay()];
    if(S.commute.officeDays.includes(dn)){
      rides.push({id:'r'+i+'a',date:labels[count]||dn,direction:'Home → Office',time:S.commute.morningTime,status:'Scheduled'});
      if(S.commute.twoWay) rides.push({id:'r'+i+'b',date:labels[count]||dn,direction:'Office → Home',time:S.commute.returnTime,status:'Scheduled'});
      count++;
    }
    d.setDate(d.getDate()+1);
  }
  S.rides=rides;
}
function toast(msg){
  let t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}
const PLAN_INFO={
  basic:{name:'Basic',tag:'Simple recurring commute',feat:['Recurring office rides','Book up to 7 days ahead','Morning + return ride','Change time 1 day before','Skip any ride']},
  advance:{name:'Advance',tag:'More flexibility for hybrid work',feat:['Everything in Basic','Flexible office days','Flexible return time','Easier rescheduling','Commute calendar']},
  pro:{name:'Pro',tag:'Extra commute protection',feat:['Everything in Advance','Reach-by-time option','Priority handling','Backup ride protection','Priority support']}
};
function topbar(title,back){
  return `<div class="topbar">${back?`<button class="back" onclick="go('${back}')">←</button>`:''}<h2>${title}</h2></div>`;
}
function screens_home(){
  return `<div class="screen"><div style="height:8px"></div>
  <h1>Your office commute, planned once.</h1>
  <p class="sub">Set your regular office schedule and let Uber manage your recurring rides.</p>
  <button class="btn btn-primary" onclick="log('office_commute_opened');go('plan')">Set Up Office Commute</button>
  ${S.active?`<button class="btn btn-secondary" onclick="go('dashboard')">View My Commute</button>`:''}
  <div class="card" style="margin-top:26px">
    <b>Why commuters need this</b>
    <p class="sub" style="margin:8px 0 0">Booking the same office ride every morning wastes time and adds uncertainty during peak hours. Configure it once, and Uber handles the rest.</p>
  </div></div>`;
}
function screens_plan(){
  let rows=Object.keys(PLAN_INFO).map(k=>{let p=PLAN_INFO[k];
    return `<div class="plan-card ${S.plan===k?'sel':''}" onclick="S.plan='${k}';log('plan_selected',{plan:'${k}'});render()">
      <h3>${p.name}</h3><p>${p.tag}</p>
      <ul>${p.feat.map(f=>`<li>${f}</li>`).join('')}</ul>
    </div>`;}).join('');
  return `${topbar('Step 1 of 5','home')}<div class="screen">
  <div class="progress"><span class="done"></span><span></span><span></span><span></span><span></span></div>
  <h1>Choose your Office Commute plan</h1>
  <div class="plans">${rows}</div>
  ${S.plan==='pro'?`<div class="card" style="margin-top:6px"><span class="concept">Concept feature — simulated for this MVP</span><p class="sub" style="margin:8px 0 0">Reliability features do not guarantee driver availability or arrival time.</p></div>`:''}
  <button class="btn btn-primary" style="margin-top:14px" onclick="log('commute_setup_started');go('setup')">Continue</button>
  </div>`;
}
function screens_setup(){
  return `${topbar('Step 2 of 5','plan')}<div class="screen">
  <div class="progress"><span class="done"></span><span class="done"></span><span></span><span></span><span></span></div>
  <h1>Set up your office commute</h1>
  <div class="field"><label>Home location</label><input id="homeLoc" value="${S.commute.homeLocation}" placeholder="e.g. Sector 56, Gurgaon"></div>
  <div class="field"><label>Office location</label><input id="officeLoc" value="${S.commute.officeLocation}" placeholder="e.g. Cyber City, Gurgaon"></div>
  <div id="setupErr" class="err"></div>
  <button class="btn btn-primary" onclick="submitSetup()">Continue</button>
  </div>`;
}
function submitSetup(){
  let h=document.getElementById('homeLoc').value.trim();
  let o=document.getElementById('officeLoc').value.trim();
  if(!h){document.getElementById('setupErr').textContent='Please add your home location.';return;}
  if(!o){document.getElementById('setupErr').textContent='Please add your office location.';return;}
  S.commute.homeLocation=h;S.commute.officeLocation=o;save();go('days');
}
function screens_days(){
  const days=['Mon','Tue','Wed','Thu','Fri'];
  let chips=days.map(d=>`<div class="chip ${S.commute.officeDays.includes(d)?'on':''}" onclick="toggleDay('${d}')">${d}</div>`).join('');
  return `${topbar('Step 3 of 5','setup')}<div class="screen">
  <div class="progress"><span class="done"></span><span class="done"></span><span class="done"></span><span></span><span></span></div>
  <h1>When do you go to the office?</h1>
  <div class="chips">${chips}</div>
  <p class="sub" style="margin-top:10px">Wednesday is left off by default — work from home.</p>
  <div id="daysErr" class="err"></div>
  <button class="btn btn-primary" style="margin-top:16px" onclick="submitDays()">Continue</button>
  </div>`;
}
function toggleDay(d){
  let i=S.commute.officeDays.indexOf(d);
  if(i>-1)S.commute.officeDays.splice(i,1);else S.commute.officeDays.push(d);
  save();render();
}
function submitDays(){
  if(S.commute.officeDays.length===0){document.getElementById('daysErr').textContent='Select at least one office day.';return;}
  go('timing');
}
function screens_timing(){
  return `${topbar('Step 4 of 5','days')}<div class="screen">
  <div class="progress"><span class="done"></span><span class="done"></span><span class="done"></span><span class="done"></span><span></span></div>
  <h1>Set your regular commute times</h1>
  <div class="field"><label>Morning pickup</label><input type="time" id="morn" value="${S.commute.morningTime}"></div>
  <div class="field"><label>Return pickup</label><input type="time" id="ret" value="${S.commute.returnTime}" ${!S.commute.twoWay?'disabled':''}></div>
  <div class="card row">
    <div><b>Book return ride automatically</b><div class="sub" style="margin:2px 0 0">Two-way commute</div></div>
    <div class="toggle ${S.commute.twoWay?'on':''}" onclick="toggleTwoWay()"><div class="dot"></div></div>
  </div>
  <div id="timeErr" class="err"></div>
  <button class="btn btn-primary" onclick="submitTiming()">Continue</button>
  </div>`;
}
function toggleTwoWay(){S.commute.twoWay=!S.commute.twoWay;save();render();}
function submitTiming(){
  let m=document.getElementById('morn').value;
  if(!m){document.getElementById('timeErr').textContent='Please select your morning pickup time.';return;}
  S.commute.morningTime=m;
  if(S.commute.twoWay){let r=document.getElementById('ret').value; if(r)S.commute.returnTime=r;}
  save();go('review');
}
function screens_review(){
  return `${topbar('Step 5 of 5','timing')}<div class="screen">
  <div class="progress"><span class="done"></span><span class="done"></span><span class="done"></span><span class="done"></span><span class="done"></span></div>
  <h1>Review your commute</h1>
  <div class="card">
    <div class="review-line"><span>Home</span><b>${S.commute.homeLocation}</b></div>
    <div class="review-line"><span>Office</span><b>${S.commute.officeLocation}</b></div>
    <div class="review-line"><span>Morning pickup</span><b>${fmt12(S.commute.morningTime)}</b></div>
    ${S.commute.twoWay?`<div class="review-line"><span>Return pickup</span><b>${fmt12(S.commute.returnTime)}</b></div>`:''}
    <div class="review-line"><span>Office days</span><b>${S.commute.officeDays.join(', ')}</b></div>
    <div class="review-line"><span>Plan</span><b>${PLAN_INFO[S.plan].name}</b></div>
    <div class="review-line"><span>Fare</span><b>Normal Uber fare</b></div>
  </div>
  <button class="btn btn-primary" onclick="confirmCommute()">Confirm Commute</button>
  </div>`;
}
function confirmCommute(){
  log('commute_setup_completed');
  toast('Your recurring commute is being checked for availability.');
  setTimeout(()=>{
    toast('Commute schedule confirmed.');
    S.active=true; genRides(); log('commute_confirmed'); save(); go('success');
  },1000);
}
function screens_success(){
  let next=S.rides[0];
  return `<div class="screen"><div style="height:10px"></div>
  <div class="check-icn">✓</div>
  <h1 style="text-align:center;font-size:22px">Office commute activated</h1>
  <p class="sub" style="text-align:center">Your recurring rides are now scheduled.</p>
  ${next?`<div class="card"><div class="day-title">NEXT COMMUTE</div><div class="ride-row"><div><div class="ride-time">${fmt12(next.time)}</div><div class="ride-dir">${next.direction}</div></div><span class="badge b-Scheduled">Scheduled</span></div></div>`:''}
  <button class="btn btn-primary" onclick="log('commute_dashboard_viewed');go('dashboard')">View Commute</button>
  <button class="btn btn-secondary" onclick="openChange(next.id)">Change Tomorrow's Time</button>
  </div>`;
}
function screens_dashboard(){
  let today=S.rides.filter(r=>r.date==='Today');
  let upcoming={};
  S.rides.filter(r=>r.date!=='Today').forEach(r=>{(upcoming[r.date]=upcoming[r.date]||[]).push(r);});
  function rideRow(r){
    return `<div class="ride-row" onclick="openDetail('${r.id}')">
      <div><div class="ride-time">${fmt12(r.time)}</div><div class="ride-dir">${r.direction}</div></div>
      <span class="badge b-${r.status}">${r.status}</span></div>`;
  }
  let manualAvoided=S.rides.length;
  return `<div class="screen"><div style="height:8px"></div>
  <h1 style="font-size:22px">My Office Commute</h1>
  <div class="card"><div class="day-title">TODAY</div>${today.length?today.map(rideRow).join(''):'<p class="sub">No commute today.</p>'}</div>
  ${Object.keys(upcoming).map(day=>`<div class="card"><div class="day-title">${day.toUpperCase()}</div>${upcoming[day].map(rideRow).join('')}</div>`).join('')}
  <div style="margin-top:18px">
    <div class="day-title">COMMUTE SUMMARY</div>
    <div class="stat-grid">
      <div class="stat"><b>${S.commute.officeDays.length}</b><span>Office days/week</span></div>
      <div class="stat"><b>${S.rides.length}</b><span>Scheduled rides</span></div>
      <div class="stat"><b>${S.stats.skipped}</b><span>Skipped</span></div>
      <div class="stat"><b>${S.stats.changed}</b><span>Changed</span></div>
    </div>
    <div class="stat" style="margin-top:10px"><b>${manualAvoided}</b><span>Manual bookings avoided this week</span></div>
  </div>
  <button class="btn btn-secondary" style="margin-top:18px" onclick="go('pro')">See Pro plan features</button>
  </div>`;
}
function openDetail(id){S.selectedRideId=id;go('detail');}
function screens_detail(){
  let r=S.rides.find(x=>x.id===S.selectedRideId);
  if(!r)return `<div class="screen">Ride not found.</div>`;
  return `${topbar('Ride details','dashboard')}<div class="screen">
  <div class="card"><div class="day-title">${r.date.toUpperCase()}</div>
    <div class="ride-row" style="border:none"><div><div class="ride-time">${fmt12(r.time)}</div><div class="ride-dir">${r.direction}</div></div><span class="badge b-${r.status}">${r.status}</span></div>
  </div>
  <button class="btn btn-primary" onclick="openChange('${r.id}')">Change Time</button>
  <button class="btn btn-ghost" onclick="go('skip')">Skip Ride</button>
  <button class="btn btn-danger" onclick="cancelRide('${r.id}')">Cancel Ride</button>
  </div>`;
}
function cancelRide(id){
  S.rides=S.rides.filter(r=>r.id!==id);save();toast('Ride cancelled.');go('dashboard');
}
function openChange(id){S.selectedRideId=id;S.pendingChangeTime=null;go('change');}
function screens_change(){
  let r=S.rides.find(x=>x.id===S.selectedRideId);
  const opts=['08:00','08:15','08:30','08:45','09:00'];
  return `${topbar("Change pickup time",'detail')}<div class="screen">
  <h1 style="font-size:22px">Change tomorrow's pickup time</h1>
  <p class="sub">Current: <b>${fmt12(r.time)}</b></p>
  <div class="time-list">${opts.map(t=>`<div class="time-opt ${S.pendingChangeTime===t?'sel':''}" onclick="S.pendingChangeTime='${t}';render()">${fmt12(t)}</div>`).join('')}</div>
  ${S.pendingChangeTime?`<div class="card" style="margin-top:14px">Your pickup time will change from <b>${fmt12(r.time)}</b> to <b>${fmt12(S.pendingChangeTime)}</b>.</div>`:''}
  <button class="btn btn-primary" ${!S.pendingChangeTime?'disabled style="opacity:.5"':''} onclick="confirmChange()">Confirm Change</button>
  </div>`;
}
function confirmChange(){
  let r=S.rides.find(x=>x.id===S.selectedRideId);
  r.time=S.pendingChangeTime;r.status='Changed';S.stats.changed++;
  log('ride_time_changed',{id:r.id,time:r.time});save();
  toast('Pickup time updated.');go('dashboard');
}
function screens_skip(){
  let r=S.rides.find(x=>x.id===S.selectedRideId);
  return `${topbar('Skip ride','detail')}<div class="screen">
  <h1 style="font-size:22px">Skip tomorrow's commute?</h1>
  <div class="card"><div class="day-title">${r.date.toUpperCase()}</div><div class="ride-row" style="border:none"><div><div class="ride-time">${fmt12(r.time)}</div><div class="ride-dir">${r.direction}</div></div></div></div>
  <button class="btn btn-danger" onclick="skipRide()">Skip Ride</button>
  <button class="btn btn-secondary" onclick="go('detail')">Keep Ride</button>
  </div>`;
}
function skipRide(){
  let r=S.rides.find(x=>x.id===S.selectedRideId);
  r.status='Skipped';S.stats.skipped++;
  log('ride_skipped',{id:r.id});save();
  toast('Ride skipped. Your other scheduled commutes remain unchanged.');
  go('dashboard');
}
function screens_pro(){
  const feats=['Reach-by-time option','Priority commute handling','Backup ride protection','Commute protection','Priority support'];
  return `${topbar('Pro plan','dashboard')}<div class="screen">
  <h1 style="font-size:22px">More protection for important office commutes</h1>
  <span class="concept">Concept feature — simulated for this MVP</span>
  <div class="card" style="margin-top:14px"><ul style="margin:0;padding-left:18px;line-height:2.1">${feats.map(f=>`<li>${f}</li>`).join('')}</ul></div>
  <p class="sub">These features are conceptual and do not represent currently available Uber functionality. Driver availability and arrival times are never guaranteed.</p>
  </div>`;
}
function screens_activity(){
  return `<div class="screen"><div style="height:8px"></div><h1 style="font-size:22px">Activity</h1>
  <p class="sub">Past and upcoming commute rides appear here.</p>
  ${S.rides.map(r=>`<div class="card row"><div><div class="ride-time">${fmt12(r.time)}</div><div class="ride-dir">${r.direction} · ${r.date}</div></div><span class="badge b-${r.status}">${r.status}</span></div>`).join('')||'<p class="sub">No rides yet — set up your office commute to get started.</p>'}
  </div>`;
}
function screens_profile(){
  return `<div class="screen"><div style="height:8px"></div><h1 style="font-size:22px">Profile</h1>
  <div class="card"><b>Plan</b><p class="sub" style="margin:4px 0 0">${PLAN_INFO[S.plan].name} — ${PLAN_INFO[S.plan].tag}</p></div>
  <div class="card"><b>Home</b><p class="sub" style="margin:4px 0 0">${S.commute.homeLocation||'Not set'}</p></div>
  <div class="card"><b>Office</b><p class="sub" style="margin:4px 0 0">${S.commute.officeLocation||'Not set'}</p></div>
  <button class="btn btn-ghost" onclick="resetAll()">Reset prototype data</button>
  </div>`;
}
function resetAll(){localStorage.removeItem('occ_state');location.reload();}
const RENDER={home:screens_home,plan:screens_plan,setup:screens_setup,days:screens_days,timing:screens_timing,review:screens_review,success:screens_success,dashboard:screens_dashboard,detail:screens_detail,change:screens_change,skip:screens_skip,pro:screens_pro,activity:screens_activity,profile:screens_profile};
function navBar(){
  const items=[['home','⌂','Home'],['dashboard','▤','Commute'],['activity','◷','Activity'],['profile','◍','Profile']];
  return `<div class="nav">${items.map(([k,ic,label])=>`<button class="${S.screen===k||(k==='dashboard'&&['detail','change','skip','pro','success','review','timing','days','setup','plan'].includes(S.screen))?'active':''}" onclick="go('${k}')"><span class="ic">${ic}</span>${label}</button>`).join('')}</div>`;
}
function render(){
  document.getElementById('app').innerHTML=(RENDER[S.screen]||screens_home)()+navBar();
}
render();
</script>
</body>
</html>
